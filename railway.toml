# =============================================================================
# Genesis Experiment — Railway service config (T-B-028)
# -----------------------------------------------------------------------------
# Deploy:
#   railway link <project-id>
#   railway up
#
# Brief acceptance criteria (T-B-028):
#   * start         = uvicorn agent.server.main:app --host 0.0.0.0 --port $PORT
#   * healthcheck   = /healthz
#   * env           = GEMINI_API_KEY, DASHBOARD_API_TOKEN,
#                     GEMINI_MONTHLY_BUDGET_USD, SANDBOX_STATE_DIR
#
# Secrets are configured in Railway's project UI (Variables tab) — NEVER
# checked into this file. The four variables below declare the env keys
# the deploy MUST have set; Railway surfaces unset-but-required vars in
# the deploy preview.
# =============================================================================

[build]
# Use the project Dockerfile so the image identity matches local `docker
# build` smoke runs. Path is relative to the repo root.
builder       = "DOCKERFILE"
dockerfilePath = "agent/server/Dockerfile"

# -----------------------------------------------------------------------------
# Persistent volume — T-B-038. CEO direction D-S11-001 §scope-decisions §7
# locks the Railway Hobby-plan 1GB volume at /data. The mount holds the
# sandbox loop's JSONL streams + snapshot, the backtest sweep output dirs,
# AND the seeded Polymarket market cache. All three live under /data so a
# Railway redeploy (which rebuilds the container's writable layer) does
# NOT lose operator-approved state.
#
# PROVISIONED 2026-06-19 via the Railway CLI (v4.30.5 DOES expose volume
# creation — the 2026-05 "UI-only" note is stale): `railway volume add -m
# /data` created volume `autopoiesis-api-volume` attached to autopoiesis-api
# at /data (confirmed in `railway status --json` volumeInstances; note the
# `railway volume list` subcommand is buggy and shows none — trust status).
# NOTE: Railway binds the volume via the imperative attachment, NOT this
# [[mounts]] stanza (deploys succeeded before any volume existed), so this
# block is documentation; volumeName is kept matching reality regardless.
# -----------------------------------------------------------------------------
[[mounts]]
mountPath = "/data"
volumeName = "autopoiesis-api-volume"

[deploy]
# uvicorn binds 0.0.0.0 — Railway's edge proxy reaches it via $PORT.
# Wrap in `/bin/sh -c "..."` so the shell handles `exec` (a builtin) +
# the chown. Railway runs startCommands in exec form — bare `exec uvicorn`
# would look up `exec` as a binary and fail (Railway Config Error 2026-05-28).
#
# `chown -R agent:agent /data` (runs as ROOT — the Dockerfile no longer
# sets `USER agent`) makes the root-owned Railway volume writable by the
# non-root agent uid; WITHOUT it uvicorn EACCES-crashes on the first state
# write under /data and /healthz never comes up (deploy 89c99cd0,
# 2026-06-19). Then `exec gosu agent uvicorn ...` drops privileges so the
# server runs non-root AND becomes PID 1 (Railway's SIGTERM reaches it).
# This MUST stay in lockstep with the Dockerfile CMD.
startCommand = "/bin/sh -c \"chown -R agent:agent /data 2>/dev/null || true; exec gosu agent uvicorn agent.server.main:app --host 0.0.0.0 --port ${PORT}\""

# Railway pings this path after the deploy boots; if the response is
# !=200 within healthcheckTimeout, the deploy is marked failed and
# rolled back. /healthz is unauthed by design (Railway's prober ships
# no bearer token).
healthcheckPath    = "/healthz"
healthcheckTimeout = 300

# Restart strategy:
#   * ON_FAILURE — uvicorn crashed (FastAPI exception, missing dep);
#     retry up to 3 times before giving up + alerting.
#   * Sandbox-loop state survives because it lives under
#     /data/sandbox (mounted volume) — not /app — so a restart
#     reconstructs from disk per the T-B-020 contract.
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 3

# 2026-05-28 hotfix: force single replica. FastAPI process is STATEFUL —
# BacktestRegistry, SandboxPhase2Loop, proposals registry are all in-memory
# dicts per process. Multi-replica means POST hits replica A (records run_id
# in A's dict), GET hits replica B (404 "unknown run_id"). Surfaced via the
# /workshop sweep diagnostic: 25+ distinct edge IPs polling, every GET 404'd.
# Sprint 11 will add Supabase-backed state if horizontal scaling becomes
# desirable; for the single-user demo path 1 replica is correct.
numReplicas = 1

# -----------------------------------------------------------------------------
# Environment variables — declared so the Railway UI shows them in the
# Variables tab; ACTUAL values are set by the operator in the UI and
# NEVER hard-coded here.
# -----------------------------------------------------------------------------
#
# Each entry's `default` is intentionally omitted for secrets so a
# missing value triggers a Railway "unset variable" warning at deploy
# time rather than silently substituting an empty string.

# Required — production Gemini API key for sentiment + reflection engines.
# Get from: https://aistudio.google.com/apikey
[[envVars]]
name = "GEMINI_API_KEY"

# Required — bearer token the dashboard sends in the Authorization header.
# Generate with: `openssl rand -hex 32` and paste into BOTH the Railway
# variable AND the Vercel project's NEXT_PUBLIC_DASHBOARD_API_TOKEN.
[[envVars]]
name = "DASHBOARD_API_TOKEN"

# Optional — monthly USD ceiling for total Gemini spend. The cost guard
# trips when the running total exceeds this value and the engines fall
# back to template stubs (warning: `cost_guard_tripped`). Default 20 USD
# matches :data:`agent.llm._smoke.DEFAULT_MONTHLY_BUDGET_USD`.
[[envVars]]
name    = "GEMINI_MONTHLY_BUDGET_USD"
default = "20.0"

# Optional — filesystem root the sandbox loop writes JSONL streams +
# snapshot into. The Dockerfile sets a default of /data/sandbox and
# expects /data to be a Railway volume mount; overriding here lets the
# operator point at a different mount without rebuilding the image.
[[envVars]]
name    = "SANDBOX_STATE_DIR"
default = "/data/sandbox"

# Optional — filesystem root the backtest sweep runner writes per-run
# results.json + lifetimes.jsonl dirs into (T-B-038). Lives under /data
# so a Railway redeploy preserves operator sweep history; the dashboard's
# workshop history pane reads back via GET /api/backtest/{run_id}.
[[envVars]]
name    = "BACKTEST_OUTPUT_ROOT"
default = "/data/backtest/runs"

# Optional — seeded Polymarket market cache the sweep runner consumes
# (T-B-038). Bootstrap one-time-primes the volume from the image's baked
# copy at agent/backtest/_cache/ on first boot (mtime-guarded so a
# rebooted volume keeps any operator-edited entries). Operator may seed
# fresh cassettes by uploading directly into the mounted volume.
[[envVars]]
name    = "BACKTEST_CACHE_DIR"
default = "/data/backtest/cache"

# -----------------------------------------------------------------------------
# Stage-2 LIVE mock-bet flags (plan-loop V1, 2026-06-17). Default "1" so the
# deploy PAPER-trades LIVE Polymarket tennis out-of-the-box — NO capital at risk
# (mock orders only; read-only public gamma/CLOB APIs). Set any to "0" in the
# Railway Variables tab to fall back (e.g. SANDBOX_LIVE=0 → replay/idle).
# -----------------------------------------------------------------------------

# LIVE mode switch (V1.3): wire live discovery + gamma settlement; never replay/synth.
[[envVars]]
name    = "SANDBOX_LIVE"
default = "1"

# Real Sackmann/CLOB baseline signals (else a deterministic synthetic source).
[[envVars]]
name    = "GENESIS_REAL_SIGNALS"
default = "1"

# Settlement-driven weight learning (能学) on realized PnL.
[[envVars]]
name    = "GENESIS_REAL_LEARNING"
default = "1"

# Set-and-forget: auto-start the sandbox loop on boot AND on a Railway restart,
# so no manual POST /api/agent/start is needed for a persistent deploy.
[[envVars]]
name    = "GENESIS_AGENT_AUTOSTART"
default = "1"
